---
- name: Prepare KVM/libvirt host for claude-code-sec-vm
  hosts: sec_vm_hosts
  become: true
  gather_facts: true
  vars:
    operator_user: "{{ ansible_user | default(ansible_env.SUDO_USER | default(ansible_user_id)) }}"
  tasks:
    - name: Install host packages
      ansible.builtin.apt:
        name:
          - qemu-kvm
          - libvirt-daemon-system
          - libvirt-clients
          - virtinst
          - cloud-image-utils
          - qemu-utils
          - nftables
          - curl
          - tar
          - xz-utils
          - python3
        state: present
        update_cache: true

    - name: Ensure libvirtd is enabled
      ansible.builtin.service:
        name: libvirtd
        state: started
        enabled: true

    - name: Add operator to required groups
      ansible.builtin.user:
        name: "{{ operator_user }}"
        groups: libvirt,kvm
        append: true
